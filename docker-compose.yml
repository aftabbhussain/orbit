services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - ES_URL=http://elasticsearch:9200
      - QDRANT_URL=http://qdrant:6333
    volumes:
      - ./.env:/app/.env
      - ./backend:/app/backend
      - ./scripts:/app/scripts
      - ./data:/app/data
    depends_on:
      elasticsearch:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - arxiv-network
